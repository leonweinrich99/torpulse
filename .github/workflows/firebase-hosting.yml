name: Build, Test & Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: |
          npm run lint
          npm run test

      - name: Build Production PWA
        run: npm run build

      - name: Deploy to Firebase Hosting (when secret configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TORPULSE_LIVE }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_TORPULSE_LIVE secret not set yet; skipping automated deploy."
            exit 0
          fi
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx firebase-tools deploy --only hosting --project torpulse-live --non-interactive
          rm -f /tmp/firebase-sa.json
